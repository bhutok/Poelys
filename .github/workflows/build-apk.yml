name: Build Poelys APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK Packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Project Dependencies
        run: npm install --legacy-peer-deps

      - name: Install Capacitor
        run: |
          npm install --legacy-peer-deps @capacitor/core@7 @capacitor/android@7
          npm install --legacy-peer-deps --save-dev @capacitor/cli@7


      - name: Generate Android Project
        run: npx cap add android

      - name: Prepare Capacitor Directories
        run: |
          mkdir -p www
          mkdir -p android/app/src/main/assets/public
          if [ ! -f www/index.html ]; then
            echo '<!DOCTYPE html><html><body>Poelys</body></html>' > www/index.html
          fi

      - name: Sync Android
        run: npx cap sync android


      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Poelys-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
